name: BusinessOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API, database and migration assurance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    env:
      MIGRATION_DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      DATABASE_URL: postgresql://businessos_runtime:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.6.0
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts" package.json
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npx prisma validate --schema prisma/schema.prisma
      - run: npm test -- --runInBand
      - run: npm run build
      - run: test -f dist/main.js
      - name: Execute every migration in order
        working-directory: .
        run: node scripts/test-migrations-pglite.mjs

  web:
    name: Web lint, production build and browser compilation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_only
      API_BASE_URL: http://127.0.0.1:4000
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.6.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npx playwright test --list

  containers:
    name: Reproducible container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: false
          tags: businessos-api:${{ github.sha }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/web
          push: false
          tags: businessos-web:${{ github.sha }}
